<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light;--ink:#202522;--muted:#727a75;--line:#e4e8e4;--bg:#f6f8f6;--green:#326b50;--soft:#e8f1eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
main{max-width:760px;margin:auto;padding:22px 16px 44px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:23px;margin:0;letter-spacing:-.03em}small,.muted{color:var(--muted)}.tabs{display:flex;gap:7px;margin:18px 0}.tabs button{flex:1;padding:10px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--muted);font-weight:600}.tabs button.active{background:var(--ink);border-color:var(--ink);color:white}
.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}.hero{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:7px 0 12px}.big{font-size:34px;font-weight:750;letter-spacing:-.04em}.goal{font-size:13px;color:var(--muted)}.track{height:8px;border-radius:9px;background:#edf0ed;overflow:hidden}.fill{height:100%;background:var(--green);border-radius:9px}.pfc-stack{display:flex;height:14px;overflow:hidden;border-radius:5px;background:#edf0ed;margin-top:16px}.pfc-seg{height:100%;min-width:0;transition:width .2s}.pfc-p{background:#4f83cc}.pfc-f{background:#e5a23b}.pfc-c{background:#45a779}.pfc-legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:9px}.pfc-key{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}.pfc-dot{width:8px;height:8px;border-radius:3px;flex:none}.pfc-key b{color:var(--ink);font-weight:650;margin-left:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric{background:var(--bg);padding:12px;border-radius:12px;min-width:0}.metric b{display:block;font-size:20px;white-space:nowrap}.metric span{font-size:12px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}h2{font-size:17px;margin:0 0 12px}.list{display:grid;gap:9px}.day{display:grid;grid-template-columns:66px 1fr 70px;align-items:center;gap:10px;font-size:12px}.barbg{height:9px;background:#edf0ed;border-radius:9px;overflow:hidden}.bar{height:100%;background:var(--green);border-radius:9px}.day.missing{opacity:.6}.day.missing .barbg{background:repeating-linear-gradient(135deg,#e4e8e4,#e4e8e4 4px,#fff 4px,#fff 8px)}.right{text-align:right;font-variant-numeric:tabular-nums}.summary{font-size:13px;color:var(--muted);margin-top:12px}.error{background:#fff0ed;color:#922f20;padding:14px;border-radius:12px}.hidden{display:none}.badge{font-size:11px;background:var(--soft);color:var(--green);padding:3px 7px;border-radius:7px}
@media(min-width:600px){main{padding-top:32px}.panel{padding:22px}.big{font-size:42px}}
</style></head><body><main>
<header><div><h1>食事ログ</h1><small id="stamp">読み込み中…</small></div><span class="badge">READ ONLY</span></header>
<div id="error" class="error hidden"></div>
<nav class="tabs"><button class="active" data-tab="today">今日</button><button data-tab="week">7日間</button><button data-tab="month">30日間</button></nav>
<section id="today">
<div class="panel"><div class="eyebrow">TODAY'S INTAKE</div><div class="hero"><div><span class="big" id="kcal">—</span> <span class="muted">kcal</span></div><div class="goal">目標 <span id="goalKcal">1,750</span> kcal</div></div><div class="track"><div id="kcalFill" class="fill" style="width:0%"></div></div><div class="pfc-stack" aria-label="PFCのカロリー構成"><div id="pSeg" class="pfc-seg pfc-p" style="width:0%"></div><div id="fSeg" class="pfc-seg pfc-f" style="width:0%"></div><div id="cSeg" class="pfc-seg pfc-c" style="width:0%"></div></div><div class="pfc-legend"><div class="pfc-key"><i class="pfc-dot pfc-p"></i>P <b id="pLegend">—</b></div><div class="pfc-key"><i class="pfc-dot pfc-f"></i>F <b id="fLegend">—</b></div><div class="pfc-key"><i class="pfc-dot pfc-c"></i>C <b id="cLegend">—</b></div></div><p class="summary" style="margin-top:6px">PFCの摂取量をカロリー換算した構成比</p><div class="grid" style="margin-top:16px">
<div class="metric"><span>たんぱく質 P</span><b id="p">—</b><span>目標 <span id="goalP">75</span> g</span></div><div class="metric"><span>脂質 F</span><b id="f">—</b><span>目標 <span id="goalF">60</span> g</span></div><div class="metric"><span>炭水化物 C</span><b id="c">—</b><span>目標 <span id="goalC">220</span> g</span></div></div><p id="todayNote" class="summary"></p></div>
<div class="panel"><div class="sectionhead"><h2>目標値</h2><small>この端末に保存</small></div><div class="grid"><label class="metric"><span>kcal</span><input id="setKcal" type="number" value="1750" min="1" style="width:100%;margin-top:6px;padding:6px;border:1px solid var(--line);border-radius:8px"></label><label class="metric"><span>P (g)</span><input id="setP" type="number" value="75" min="1" style="width:100%;margin-top:6px;padding:6px;border:1px solid var(--line);border-radius:8px"></label><label class="metric"><span>F (g)</span><input id="setF" type="number" value="60" min="1" style="width:100%;margin-top:6px;padding:6px;border:1px solid var(--line);border-radius:8px"></label></div><label class="metric" style="display:block;margin-top:9px"><span>C (g)</span><input id="setC" type="number" value="220" min="1" style="width:100%;margin-top:6px;padding:6px;border:1px solid var(--line);border-radius:8px"></label><button id="saveGoals" style="margin-top:10px;width:100%;padding:10px;border:0;border-radius:10px;background:var(--ink);color:white;font-weight:600">目標を保存</button></div>
</section>
<section id="week" class="hidden"><div class="panel"><div class="sectionhead"><h2>直近7日間</h2><small>記録日ベース</small></div><div id="weekList" class="list"></div><p id="weekNote" class="summary"></p></div></section>
<section id="month" class="hidden"><div class="panel"><div class="sectionhead"><h2>直近30日間</h2><small>kcal / 日</small></div><div id="monthList" class="list"></div><p id="monthNote" class="summary"></p></div><div class="panel"><h2>記録日の平均</h2><div class="grid"><div class="metric"><span>カロリー</span><b id="avgKcal">—</b><span>kcal / 日</span></div><div class="metric"><span>たんぱく質</span><b id="avgP">—</b><span>g / 日</span></div><div class="metric"><span>脂質</span><b id="avgF">—</b><span>g / 日</span></div></div><p id="avgNote" class="summary"></p></div></section>
</main><script>
let data=null;
const $=id=>document.getElementById(id);
const fmt=(n,d=0)=>Number(n||0).toLocaleString('ja-JP',{maximumFractionDigits:d,minimumFractionDigits:d});
function goals(){return {kcal:+$('setKcal').value||1750,p:+$('setP').value||75,f:+$('setF').value||60,c:+$('setC').value||220}}
function loadGoals(){try{const g=JSON.parse(localStorage.getItem('mealLogGoals')||'null');if(g){$('setKcal').value=g.kcal;$('setP').value=g.p;$('setF').value=g.f;$('setC').value=g.c}}catch(e){}}
function saveGoals(){const g=goals();localStorage.setItem('mealLogGoals',JSON.stringify(g));render()}
function render(){if(!data)return;const g=goals(),t=data.today;
$('goalKcal').textContent=fmt(g.kcal);$('goalP').textContent=fmt(g.p);$('goalF').textContent=fmt(g.f);$('goalC').textContent=fmt(g.c);
$('kcal').textContent=t.recorded?fmt(t.kcal):'—';$('p').textContent=t.recorded?fmt(t.p,1)+' g':'—';$('f').textContent=t.recorded?fmt(t.f,1)+' g':'—';$('c').textContent=t.recorded?fmt(t.c,1)+' g':'—';
$('kcalFill').style.width=t.recorded?Math.min(100,t.kcal/g.kcal*100)+'%':'0%';
const pk=Math.max(0,t.p||0)*4,fk=Math.max(0,t.f||0)*9,ck=Math.max(0,t.c||0)*4,macroKcal=pk+fk+ck;
$('pSeg').style.width=macroKcal?pk/macroKcal*100+'%':'0%';$('fSeg').style.width=macroKcal?fk/macroKcal*100+'%':'0%';$('cSeg').style.width=macroKcal?ck/macroKcal*100+'%':'0%';
$('pLegend').textContent=t.recorded?fmt(t.p,1)+'g':'—';$('fLegend').textContent=t.recorded?fmt(t.f,1)+'g':'—';$('cLegend').textContent=t.recorded?fmt(t.c,1)+'g':'—';
$('todayNote').textContent=t.recorded?('記録 '+t.entries+' 件 · 水分 '+fmt(t.water)+' mL'): '今日はまだ記録がありません（0 kcalとは区別しています）。';
drawList('weekList',data.days7);drawList('monthList',data.days30);
$('weekNote').textContent='記録 '+data.days7.filter(d=>d.recorded).length+' / 7 日。未記録日は平均計算に含めません。';
$('monthNote').textContent='記録 '+data.averages30.days+' / 30 日。縞模様は未記録日です。';
const a=data.averages30;$('avgKcal').textContent=a.days?fmt(a.kcal):'—';$('avgP').textContent=a.days?fmt(a.p,1):'—';$('avgF').textContent=a.days?fmt(a.f,1):'—';$('avgNote').textContent=a.days?'記録がある '+a.days+' 日の平均。未記録日は除外。':'集計できる記録がありません。';
}
function drawList(id,days){const max=Math.max(1,...days.filter(d=>d.recorded).map(d=>d.kcal));$(id).innerHTML=days.map(d=>{const dt=new Date(d.date+'T12:00:00');const label=(dt.getMonth()+1)+'/'+dt.getDate();return '<div class="day '+(!d.recorded?'missing':'')+'"><span>'+label+'</span><div class="barbg"><div class="bar" style="width:'+(d.recorded?Math.max(1,d.kcal/max*100):0)+'%"></div></div><span class="right">'+(d.recorded?fmt(d.kcal)+' kcal':'未記録')+'</span></div>'}).join('')}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['today','week','month'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))}));
$('saveGoals').addEventListener('click',saveGoals);loadGoals();
google.script.run.withSuccessHandler(d=>{data=d;$('stamp').textContent='更新 '+d.updatedAt;render()}).withFailureHandler(e=>{$('error').textContent='データを読み込めませんでした: '+(e&&e.message?e.message:String(e));$('error').classList.remove('hidden');$('stamp').textContent='読み込み失敗'}).getDashboardData();
</script></body></html>
